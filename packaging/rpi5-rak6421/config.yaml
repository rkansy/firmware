### Meshtasticd config for k4nsy-long class hardware:
### Raspberry Pi 5 + RAK6421 (SX1262) in HAT slot 1 + serial GPS.
###
### This is the main config. Per-radio hardware profiles live in config.d/
### and are merged on top of this file at startup.
###
### Multi-client note: this build of meshtasticd serves the TCP API (port
### 4403) to any number of concurrent clients natively — no external
### multiplexer proxy is required. Each client gets its own config handshake
### and packet-id space; live traffic fans out to all connected clients.

Lora:
  # Overridden by config.d/lora-RAK6421-13300-slot1.yaml
  Module: auto

GPS:
  SerialPath: /dev/ttyAMA0

Logging:
  LogLevel: info
  # Single packet stream: the JSON packet log (rotated every 60 min by the
  # daemon, filtered to position packets). It lives in the VFS dir so it is
  # owned by user 'meshtasticd' and persisted by the /var/lib/meshtasticd
  # volume in Docker. No separate TraceFile: the JSON log is the only log
  # file this package ships.
  JSONFile: /var/lib/meshtasticd/packets.json
  JSONFileRotate: 60
  JSONFilter: position
  AsciiLogs: true

Webserver:
  Port: 9443
  RootPath: /usr/share/meshtasticd/web
  SSLKey: /etc/meshtasticd/ssl/private_key.pem
  SSLCert: /etc/meshtasticd/ssl/certificate.pem

General:
  # Node MAC — required, not optional. Without an explicit MAC the daemon
  # falls back to hardware autoconf (skipped here: the config.d profile pins
  # Lora.Module: sx1262) and then to the Bluetooth HCI adapter. That BT
  # fallback is dead on hosts with BT disabled (the usual way to free
  # /dev/ttyAMA0 for the serial GPS) and inside containers with their own
  # network namespace — in every such case the daemon prints "Blank MAC
  # Address not allowed!" and exits. This value mirrors the reference node
  # k4nsy-long (its live node ID); change it when deploying elsewhere.
  MACAddress: 88:A2:9E:8B:80:5D
  APIPort: 4403
  MaxNodes: 512
  MaxMessageQueue: 100
  ConfigDirectory: /etc/meshtasticd/config.d/
  AvailableDirectory: /etc/meshtasticd/available.d/
